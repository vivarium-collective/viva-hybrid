[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-hybrid-ref"
version = "0.1.0"
description = "Python reference implementation for the viva-hybrid trial"
requires-python = ">=3.10,<3.13"
dependencies = [
  "python-libsbml",
  "numpy",
  "scipy",
  "numba",
  "pyyaml",
  "pytest",
]

[tool.setuptools]
packages = ["viva_hybrid_ref"]
